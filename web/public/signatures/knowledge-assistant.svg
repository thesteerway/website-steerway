<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="c-bloom" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c3a268" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c3a268" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e6c4"/>
      <stop offset="1" stop-color="#b4924f"/>
    </linearGradient>
    <linearGradient id="c-pillar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dcae" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f0dcae" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="c-orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5e6c4"/>
      <stop offset="0.5" stop-color="#e3c88f"/>
      <stop offset="1" stop-color="#b4924f"/>
    </radialGradient>
    <filter id="c-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="c-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0a0a0c"/>
  <g stroke="rgba(236,231,221,0.06)">
    <line x1="800" y1="540" x2="60" y2="900"/><line x1="800" y1="540" x2="360" y2="900"/><line x1="800" y1="540" x2="660" y2="900"/><line x1="800" y1="540" x2="940" y2="900"/><line x1="800" y1="540" x2="1240" y2="900"/><line x1="800" y1="540" x2="1540" y2="900"/>
    <path d="M 220 700 Q 800 660 1380 700" fill="none"/>
    <path d="M 100 790 Q 800 740 1500 790" fill="none"/>
  </g>
  <rect width="1600" height="900" fill="url(#c-bloom)"/>

  <!-- THE CODEX: an open book that answers -->
  <ellipse cx="800" cy="700" rx="420" ry="58" fill="#000" opacity="0.6" filter="url(#c-soft)"/>

  <!-- platform -->
  <g>
    <polygon points="800,520 1150,646 800,772 450,646" fill="rgba(236,231,221,0.05)" stroke="rgba(236,231,221,0.35)" stroke-width="1.5"/>
    <polygon points="1150,646 800,772 800,806 1150,680" fill="rgba(236,231,221,0.025)" stroke="rgba(236,231,221,0.2)"/>
    <polygon points="450,646 800,772 800,806 450,680" fill="rgba(0,0,0,0.4)" stroke="rgba(236,231,221,0.2)"/>
  </g>

  <!-- the open book, oversized, ivory pages -->
  <g>
    <!-- left leaf -->
    <polygon points="800,560 520,470 520,430 800,514" fill="#e6e0d2" stroke="rgba(236,231,221,0.8)" stroke-width="1.5"/>
    <!-- right leaf -->
    <polygon points="800,560 1080,470 1080,430 800,514" fill="#d3ccba" stroke="rgba(236,231,221,0.8)" stroke-width="1.5"/>
    <!-- page edges (thickness) -->
    <polygon points="520,470 800,560 800,588 520,498" fill="#b9b2a0"/>
    <polygon points="1080,470 800,560 800,588 1080,498" fill="#a49d8a"/>
    <!-- text lines lying on the pages -->
    <g stroke="#8a8375" stroke-width="2.4">
      <line x1="580" y1="463" x2="760" y2="519"/>
      <line x1="580" y1="450" x2="742" y2="500"/>
      <line x1="600" y1="440" x2="742" y2="484"/>
      <line x1="840" y1="519" x2="1020" y2="463"/>
      <line x1="858" y1="500" x2="1020" y2="450"/>
    </g>
    <!-- the spine glowing -->
    <line x1="800" y1="514" x2="800" y2="588" stroke="#f0dcae" stroke-width="2.5" opacity="0.9"/>
  </g>

  <!-- the answer rising: pillar of light into an orb -->
  <polygon points="788,514 812,514 830,220 770,220" fill="url(#c-pillar)" opacity="0.35"/>
  <line x1="800" y1="514" x2="800" y2="230" stroke="url(#c-pillar)" stroke-width="3"/>
  <g transform="translate(800,200)">
    <circle r="64" fill="#f0dcae" opacity="0.2" filter="url(#c-glow)"/>
    <circle r="34" fill="url(#c-orb)"/>
    <ellipse rx="66" ry="18" fill="none" stroke="rgba(240,220,170,0.6)" stroke-width="1.6" transform="rotate(-18)"/>
  </g>

  <!-- knowledge motes: fragments leaving the pages, spiralling up -->
  <g fill="#ece7dd">
    <rect x="742" y="430" width="9" height="9" transform="rotate(24 746 434)" opacity="0.85"/>
    <rect x="852" y="392" width="8" height="8" transform="rotate(-14 856 396)" opacity="0.7"/>
    <rect x="768" y="342" width="7" height="7" transform="rotate(40 771 345)" opacity="0.6"/>
    <rect x="836" y="300" width="6" height="6" transform="rotate(10 839 303)" opacity="0.5"/>
    <rect x="784" y="262" width="5" height="5" transform="rotate(30 786 264)" opacity="0.4"/>
  </g>
  <path d="M 740 440 C 700 360 760 300 795 245" fill="none" stroke="rgba(195,162,104,0.25)" stroke-width="1.4" stroke-dasharray="1 7"/>
  <path d="M 866 400 C 900 330 840 280 808 240" fill="none" stroke="rgba(195,162,104,0.25)" stroke-width="1.4" stroke-dasharray="1 7"/>

  <!-- two shelved books waiting on the platform, closed -->
  <g stroke="rgba(236,231,221,0.5)" stroke-width="1.4">
    <polygon points="560,620 640,648 640,610 560,582" fill="#131316"/>
    <polygon points="560,582 640,610 654,600 574,572" fill="rgba(236,231,221,0.12)"/>
    <polygon points="1040,648 1120,620 1120,582 1040,610" fill="#131316"/>
    <polygon points="1040,610 1120,582 1104,572 1026,600" fill="rgba(236,231,221,0.12)"/>
  </g>

  <g fill="#ece7dd">
    <circle cx="330" cy="240" r="2" opacity="0.4"/>
    <circle cx="520" cy="170" r="1.6" opacity="0.3"/>
    <circle cx="1260" cy="210" r="2.2" opacity="0.45"/>
    <circle cx="1380" cy="470" r="1.6" opacity="0.3"/>
    <circle cx="240" cy="470" r="1.8" opacity="0.35"/>
    <circle cx="1090" cy="140" r="1.5" opacity="0.3"/>
  </g>

  <!-- caption chip: uniform pill, right-aligned across the series -->
  <g transform="translate(1146,790)" font-family="ui-monospace, monospace">
    <rect width="384" height="52" rx="26" fill="rgba(19,19,22,0.88)" stroke="rgba(195,162,104,0.4)"/>
    <circle cx="26" cy="26" r="5" fill="#f0dcae"/>
    <text x="48" y="33" fill="#c3a268" font-size="17" letter-spacing="2.5">YOUR DOCS · ANSWERING</text>
  </g>
</svg>
