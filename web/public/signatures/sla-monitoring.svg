<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="e-bloom" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#c3a268" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c3a268" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="e-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e6c4"/>
      <stop offset="1" stop-color="#b4924f"/>
    </linearGradient>
    <linearGradient id="e-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0dcae" stop-opacity="0"/>
      <stop offset="1" stop-color="#f0dcae" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="e-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="e-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0a0a0c"/>
  <g stroke="rgba(236,231,221,0.06)">
    <line x1="800" y1="540" x2="60" y2="900"/><line x1="800" y1="540" x2="360" y2="900"/><line x1="800" y1="540" x2="660" y2="900"/><line x1="800" y1="540" x2="940" y2="900"/><line x1="800" y1="540" x2="1240" y2="900"/><line x1="800" y1="540" x2="1540" y2="900"/>
    <path d="M 220 700 Q 800 660 1380 700" fill="none"/>
    <path d="M 100 790 Q 800 740 1500 790" fill="none"/>
  </g>
  <rect width="1600" height="900" fill="url(#e-bloom)"/>

  <!-- THE SENTINEL: a watch-instrument that never sleeps -->
  <ellipse cx="800" cy="712" rx="430" ry="58" fill="#000" opacity="0.6" filter="url(#e-soft)"/>

  <!-- dial platform -->
  <g>
    <ellipse cx="800" cy="560" rx="400" ry="180" fill="rgba(236,231,221,0.045)" stroke="rgba(236,231,221,0.4)" stroke-width="1.6"/>
    <ellipse cx="800" cy="560" rx="400" ry="180" fill="none" stroke="rgba(236,231,221,0.12)" stroke-width="8" filter="url(#e-glow)"/>
    <ellipse cx="800" cy="560" rx="300" ry="132" fill="none" stroke="rgba(236,231,221,0.16)"/>
    <ellipse cx="800" cy="560" rx="190" ry="82" fill="none" stroke="rgba(236,231,221,0.16)"/>
    <ellipse cx="800" cy="560" rx="80" ry="34" fill="none" stroke="rgba(236,231,221,0.2)"/>
    <!-- graduation ticks around the rim -->
    <g stroke="rgba(236,231,221,0.35)">
      <line x1="800" y1="380" x2="800" y2="398"/>
      <line x1="1200" y1="560" x2="1178" y2="560"/>
      <line x1="800" y1="740" x2="800" y2="722"/>
      <line x1="400" y1="560" x2="422" y2="560"/>
      <line x1="1083" y1="433" x2="1068" y2="443"/>
      <line x1="517" y1="687" x2="532" y2="677"/>
      <line x1="1083" y1="687" x2="1068" y2="677"/>
      <line x1="517" y1="433" x2="532" y2="443"/>
    </g>
  </g>

  <!-- the sweep: a luminous sector turning over the dial -->
  <path d="M 800 560 L 1190 470 A 400 180 0 0 0 1080 430 Z" fill="url(#e-sweep)" opacity="0.6"/>
  <line x1="800" y1="560" x2="1190" y2="470" stroke="#f0dcae" stroke-width="2" opacity="0.8"/>
  <line x1="800" y1="560" x2="1190" y2="470" stroke="#f0dcae" stroke-width="2" filter="url(#e-glow)" opacity="0.5"/>

  <!-- the one blip it ever found, ringed and fading -->
  <g transform="translate(600,498)">
    <circle r="7" fill="#c3a268"/>
    <circle r="7" fill="#c3a268" filter="url(#e-glow)" opacity="0.7"/>
    <ellipse rx="34" ry="15" fill="none" stroke="rgba(195,162,104,0.5)"/>
    <ellipse rx="62" ry="27" fill="none" stroke="rgba(195,162,104,0.25)"/>
  </g>

  <!-- green heartbeats: the checks, quietly passing, dotted on the dial -->
  <g fill="#7fb08f">
    <circle cx="930" cy="620" r="4.5" opacity="0.8"/>
    <circle cx="700" cy="640" r="4.5" opacity="0.7"/>
    <circle cx="1020" cy="520" r="4.5" opacity="0.75"/>
    <circle cx="760" cy="480" r="4.5" opacity="0.7"/>
    <circle cx="890" cy="470" r="4.5" opacity="0.65"/>
    <circle cx="640" cy="580" r="4.5" opacity="0.7"/>
  </g>

  <!-- the watch-tower needle at the centre, lamp lit -->
  <g transform="translate(800,560)">
    <polygon points="0,-190 16,-6 0,10 -16,-6" fill="rgba(19,19,22,0.95)" stroke="rgba(236,231,221,0.7)" stroke-width="1.5"/>
    <circle cy="-206" r="9" fill="url(#e-gold)"/>
    <circle cy="-206" r="24" fill="#f0dcae" opacity="0.2" filter="url(#e-glow)"/>
    <ellipse cy="8" rx="34" ry="14" fill="rgba(236,231,221,0.08)" stroke="rgba(236,231,221,0.35)"/>
  </g>

  <g fill="#ece7dd">
    <circle cx="330" cy="240" r="2" opacity="0.4"/>
    <circle cx="520" cy="170" r="1.6" opacity="0.3"/>
    <circle cx="1260" cy="210" r="2.2" opacity="0.45"/>
    <circle cx="1380" cy="470" r="1.6" opacity="0.3"/>
    <circle cx="240" cy="470" r="1.8" opacity="0.35"/>
    <circle cx="1090" cy="140" r="1.5" opacity="0.3"/>
  </g>

  <!-- caption chip: uniform pill, right-aligned across the series -->
  <g transform="translate(1146,790)" font-family="ui-monospace, monospace">
    <rect width="384" height="52" rx="26" fill="rgba(19,19,22,0.88)" stroke="rgba(195,162,104,0.4)"/>
    <circle cx="26" cy="26" r="5" fill="#f0dcae"/>
    <text x="48" y="33" fill="#c3a268" font-size="17" letter-spacing="2.5">WATCHING · 24 / 7 / 365</text>
  </g>
</svg>
